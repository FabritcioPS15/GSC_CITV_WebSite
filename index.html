  <!--
    Metadatos de la home.
    React Helmet sobreescribe esto en cada ruta al montar la app; se mantiene
    correcto acá porque es lo que leen los rastreadores que no ejecutan JS.

    data-rh="true" marca las tags como gestionadas por Helmet: sin él, Helmet
    solo reemplaza tags con ese atributo y la home quedaba con 2 canonicals
    (la estática y la de la ruta), lo que hacía que Google consolidara las
    páginas internas contra la home ("página alternativa con canónica adecuada").
  -->
  <title>Revisión Técnica Vehicular en el Perú | RTP San Cristóbal</title>
  <meta name="description" data-rh="true"
    content="Revisión técnica vehicular autorizada por el MTC. Inspección técnica de autos, camionetas, camiones y buses con certificado oficial. Sedes en Lima y provincias. Consulta tu revisión técnica por placa.">
  <meta name="keywords" data-rh="true"
    content="revisión técnica, revisión técnica vehicular, revisiones técnicas, RTP, RTV, RTP San Cristóbal, RTV San Cristóbal, grupo san cristobal, inspección técnica vehicular, centro de revisión técnica, revisión técnica Lima, revisión técnica Perú, certificado de inspección vehicular, inspección vehicular MTC">
  <meta name="author" data-rh="true" content="RTP San Cristóbal">
  <meta name="robots" data-rh="true" content="index, follow, max-image-preview:large">
  <link rel="canonical" data-rh="true" href="https://gruposancristobal.pe/">

  <meta property="og:title" data-rh="true" content="Revisión Técnica Vehicular en el Perú | RTP San Cristóbal">
  <meta property="og:description" data-rh="true"
    content="Centro de revisión técnica vehicular autorizado por el MTC. Inspección de vehículos livianos y pesados con certificado oficial en Lima y provincias.">
  <meta property="og:image" data-rh="true" content="https://gruposancristobal.pe/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
